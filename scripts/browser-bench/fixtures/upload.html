<!doctype html><meta charset="utf-8"><title>上传报价单</title>
<style>body{font:14px/1.6 system-ui;margin:40px;max-width:520px}.fake{display:inline-block;padding:8px 18px;background:#1976d2;color:#fff;border-radius:6px;cursor:pointer}#out{margin-top:16px;color:#2e7d32}</style>
<h2>上传报价单</h2>
<p>请上传报价单文件，支持 PDF、Word。</p>
<span class="fake" id="pick">选择文件…</span>
<input type="file" id="file" style="display:none">
<div id="out"></div>
<script>
const inp=document.getElementById('file');
document.getElementById('pick').addEventListener('click',()=>inp.click());
inp.addEventListener('change',()=>{
  const f=inp.files[0];
  document.getElementById('out').textContent = f ? ('已选择：'+f.name+'（'+Math.round(f.size/1024)+'KB），正在上传… 上传完成') : '';
});
</script>
