name: Bug report / Bug 反馈
description: Report something that is not working. 报告产品异常。
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Fill every required field so we can reproduce the issue.
        请填写所有必填项，便于复现与排查。
  - type: textarea
    id: description
    attributes:
      label: What happened? / 问题描述
      description: What broke, and what is the impact?
      placeholder: Switching plugin views leaves the previous view rendered.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Numbered steps from a cold start when possible.
      placeholder: |
        1. Launch the app
        2. Open 插件
        3. Select a plugin
        4. The content area stays blank
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
      placeholder: The plugin view renders.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
      placeholder: The content area stays blank with no error shown.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version / 应用版本
      description: Version of the installed build or the release you are running. Example 0.1.0
      placeholder: '0.1.0'
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system / 操作系统
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Extra environment / 其他环境信息
      description: Architecture and install type (DMG, NSIS, AppImage, deb, rpm, development).
      placeholder: darwin arm64 · DMG · macOS 15.4
  - type: textarea
    id: logs
    attributes:
      label: Logs / 日志
      description: Terminal output from `pnpm dev`, or log lines from the packaged app. Paste only the relevant part.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / 截图
      description: Optional. Drag and drop images.
