name: Linux package validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux x64 packages
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Build Linux packages
        run: pnpm exec electron-builder --linux --x64 --publish never

      - name: Verify package set
        run: |
          set -euo pipefail
          ls -la dist
          for pattern in '*.AppImage' '*.deb' '*.rpm'; do
            if ! compgen -G "dist/$pattern" > /dev/null; then
              echo "::error::Missing Linux package matching $pattern"
              exit 1
            fi
          done

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: workstudio-linux-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
