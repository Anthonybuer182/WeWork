name: CI

on:
  push:
    branches: [main, ci/debug]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Read-only: this workflow never writes back to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Build / typecheck / lint / test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Version comes from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          set -o pipefail
          if pnpm build --output-logs=full > /tmp/build.log 2>&1; then
            echo "build ok"
          else
            echo "===== build failed — matching error lines ====="
            grep -nE "error|Error|ERROR|failed|Failed|✗|Cannot|not found|ENOENT|RollupError|Build failed" /tmp/build.log | head -40
            echo "===== last 60 lines ====="
            tail -60 /tmp/build.log
            echo "===== as annotations ====="
            grep -E "error|Error|ERROR|✗|Cannot|ENOENT|RollupError|Build failed" /tmp/build.log | tail -8 | cut -c1-400 | sed 's/^/::error::/'
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
