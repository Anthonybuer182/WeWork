version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      dev-dependencies:
        dependency-type: development

    # 下面这些包的主版本都是破坏性变更，要整套迁移（配置重写 + 真机回归），
    # 不适合按周自动提 PR：tailwind 4 换成 CSS-first 配置、vite 8 /
    # electron-vite 6 / @vitejs/plugin-react 6 换构建管线、electron 45 /
    # electron-builder 26 换运行时与打包、typescript 7 换编译器。
    # 小版本和补丁照常提；大版本来了由人单独安排。
    ignore:
      - dependency-name: 'electron'
        update-types: ['version-update:semver-major']
      - dependency-name: 'electron-builder'
        update-types: ['version-update:semver-major']
      - dependency-name: 'electron-vite'
        update-types: ['version-update:semver-major']
      - dependency-name: 'vite'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/plugin-react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
