<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>浏览器</title>
  <style>
    /* 主题令牌是宿主注入的 Tailwind 风格 HSL 分量(见 packages/ui 的 panel-relay.tsx,
       内联在 <html> 上,压过这里),所以一切颜色必须写成 hsl(var(--x, <分量兜底>)):
       注入时跟随应用主题,未注入时落到这里的暗色分量。直接 var(--x) 会在注入后失效。 */
    :root {
      --background: 222 19% 7%; --foreground: 220 21% 92%;
      --card: 222 15% 11%;
      --muted-foreground: 217 9% 59%;
      --accent: 221 19% 17%;
      --border: 218 14% 20%; --ring: 218 100% 65%;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      background: hsl(var(--background, 222 19% 7%));
      color: hsl(var(--foreground, 220 21% 92%));
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      font-size: 13px;
      overflow: hidden;
    }
    #toolbar {
      flex: none;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 8px;
      border-bottom: 1px solid hsl(var(--border, 218 14% 20%));
      background: hsl(var(--card, 222 15% 11%));
    }
    /* Icon buttons match the host toolbar: 28px hit area, 16px lucide-style
       2px stroke glyphs in currentColor. Text glyphs (← ⟳ ☆) rendered at a
       different optical size and weight than the shell's icons. */
    #toolbar button {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: hsl(var(--muted-foreground, 217 9% 59%));
      cursor: pointer;
    }
    #toolbar button svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #toolbar button:hover { background: hsl(var(--accent, 221 19% 17%)); }
    #toolbar button:active { transform: scale(0.94); }
    #toolbar button:disabled { opacity: 0.4; cursor: default; }
    #toolbar button:disabled:hover { background: transparent; }
    #btn-star.on { color: hsl(43 90% 62%); }
    #btn-star.on svg { fill: currentColor; }
    #url {
      flex: 1;
      min-width: 0;
      height: 28px;
      padding: 0 10px;
      border: 1px solid hsl(var(--border, 218 14% 20%));
      border-radius: 6px;
      background: hsl(var(--background, 222 19% 7%));
      color: hsl(var(--foreground, 220 21% 92%));
      font-size: 12px;
      outline: none;
    }
    #url:focus { border-color: hsl(var(--ring, 218 100% 65%)); }

    /* 下拉列表(收藏 + 历史)必须长在文档流里,不能绝对定位悬浮在页面上:
       引擎视图是宿主进程里的原生 WebContentsView,永远盖在页面 DOM 之上、
       吞掉落在它身上的点击(见 apps/desktop/src/main/plugins/slots.ts)。
       下拉展开时挤占 #page-slot,piSDK.liveSlot 的 ResizeObserver 会上报新
       矩形、把引擎视图挪到下拉下面,露出并让出这块区域的点击。 */
    #omnibox {
      flex: none;
      max-height: min(320px, 45vh);
      display: flex;
      flex-direction: column;
      border-bottom: 1px solid hsl(var(--border, 218 14% 20%));
      background: hsl(var(--card, 222 15% 11%));
      overflow: hidden;
    }
    #omnibox[hidden] { display: none; }
    #omni-list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0; }
    .sec {
      padding: 5px 12px 3px;
      font-size: 11px;
      letter-spacing: 0.02em;
      color: hsl(var(--muted-foreground, 217 9% 59%));
      user-select: none;
    }
    .row { display: flex; align-items: center; gap: 8px; padding: 5px 12px; cursor: pointer; }
    .row.active, .row:hover { background: hsl(var(--accent, 221 19% 17%)); }
    .row-main { flex: 1; min-width: 0; }
    .row-title {
      font-size: 12.5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row-url {
      font-size: 11px;
      color: hsl(var(--muted-foreground, 217 9% 59%));
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .row-side { flex: none; font-size: 11px; color: hsl(var(--muted-foreground, 217 9% 59%)); }
    .row-x {
      flex: none;
      width: 18px; height: 18px;
      border: none; border-radius: 4px;
      background: transparent;
      color: hsl(var(--muted-foreground, 217 9% 59%));
      font-size: 11px; line-height: 1;
      cursor: pointer;
      visibility: hidden;
    }
    .row:hover .row-x, .row.active .row-x { visibility: visible; }
    /* Recipes are a list, not navigation targets: their own class keeps them
       out of the keyboard-highlight indexing (.row → flatItems). */
    .recipe-row { display: flex; align-items: center; gap: 8px; padding: 5px 12px; }
    .recipe-row .row-x { visibility: visible; }
    .recipe-note { padding: 2px 12px 4px; font-size: 11px; color: hsl(var(--muted-foreground, 217 9% 59%)); }
    .recipe-edit { padding: 6px 12px 10px; }
    .re-name-label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: hsl(var(--muted-foreground, 217 9% 59%)); margin-bottom: 6px; }
    .re-name, .re-target, .re-value, .re-expect {
      background: transparent; color: inherit; font: inherit; padding: 2px 6px;
      border: 1px solid hsl(var(--border, 218 14% 20%)); border-radius: 4px; min-width: 0;
    }
    .re-name { flex: 1; }
    .re-steps { display: flex; flex-direction: column; gap: 4px; }
    .re-step { display: flex; align-items: center; gap: 6px; }
    .re-kind { width: 44px; flex: none; font-size: 11px; color: hsl(var(--muted-foreground, 217 9% 59%)); }
    .re-target { flex: 2; }
    .re-value, .re-expect { flex: 1; }
    .re-actions { margin-top: 8px; display: flex; gap: 8px; }
    .re-actions button {
      padding: 3px 12px; border-radius: 4px; cursor: pointer;
      border: 1px solid hsl(var(--border, 218 14% 20%)); background: transparent; color: inherit; font: inherit;
    }
    .re-actions .re-save { border-color: hsl(var(--ring, 218 100% 65%)); }
    /* The step that failed last time, marked in place: the user opens the
       editor to FIX one thing, and should not have to guess which. */
    .re-step.bad, .run-step.bad {
      background: hsl(var(--destructive, 0 70% 50%) / 0.12);
      border-radius: 4px;
    }
    .re-warn {
      margin: 2px 0 8px; padding: 4px 8px; border-radius: 4px; font-size: 11px;
      background: hsl(var(--destructive, 0 70% 50%) / 0.12);
      color: hsl(var(--destructive-foreground, 0 70% 72%));
    }
    .recipe-run { padding: 6px 12px 10px; }
    .run-title { font-size: 12px; margin-bottom: 6px; }
    .run-steps { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
    .run-step { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 1px 4px; }
    .run-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .run-val, .run-file {
      background: transparent; color: inherit; font: inherit; padding: 2px 6px;
      border: 1px solid hsl(var(--border, 218 14% 20%)); border-radius: 4px;
    }
    .run-file { margin-left: 6px; flex: 1; }
    .run-val { flex: 1; }
    .run-tip { font-size: 11px; color: hsl(var(--muted-foreground, 217 9% 59%)); margin-bottom: 6px; }
    .run-out { margin-top: 8px; font-size: 11px; display: flex; flex-direction: column; gap: 3px; }
    .run-out .line { color: hsl(var(--muted-foreground, 217 9% 59%)); word-break: break-word; }
    .run-head { font-size: 12px; margin-bottom: 4px; }
    .run-head.bad { color: hsl(var(--destructive, 0 70% 62%)); }
    .row-x:hover { background: hsl(var(--border, 218 14% 20%)); color: hsl(var(--foreground, 220 21% 92%)); }
    .empty {
      padding: 16px 12px;
      font-size: 12px;
      color: hsl(var(--muted-foreground, 217 9% 59%));
      text-align: center;
      user-select: none;
    }
    #omni-foot {
      flex: none;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 12px;
      border-top: 1px solid hsl(var(--border, 218 14% 20%));
    }
    #omni-foot label {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px;
      cursor: pointer; user-select: none;
      white-space: nowrap;
    }
    #chk-private, #chk-sel { accent-color: hsl(var(--ring, 218 100% 65%)); cursor: pointer; }
    #btn-clear {
      margin-left: auto;
      border: none; border-radius: 4px;
      background: transparent;
      color: hsl(var(--muted-foreground, 217 9% 59%));
      font-size: 12px;
      padding: 2px 6px;
      cursor: pointer;
    }
    #btn-clear:hover { background: hsl(var(--accent, 221 19% 17%)); }
    #btn-clear.armed { color: hsl(0 72% 62%); }

    /* The engine view is positioned exactly over this region by the host
       (piSDK.liveSlot). Keep it empty — anything painted here is covered. */
    #page-slot { flex: 1; min-height: 0; }
    /* NON-split mode: the primary slot must FILL the region — an empty div
       here has zero height, and the engine view would be positioned 0×0
       (invisible + swallowed). height:100% inside the block parent. */
    #page-slot-a { display: block; width: 100%; height: 100%; }
    /* Split mode: the region becomes a flex row; pane A takes the remembered
       share (JS writes paneA.style.flex), B fills the rest. */
    body.split #page-slot { display: flex; }
    body.split #page-slot-a { width: auto; height: auto; }
    #page-slot-b { display: none; }
    body.split #page-slot-b { display: block; flex: 1 1 0%; min-width: 0; }
    /* Split view: two panes share the region; the secondary starts hidden so
       its live slot reports 0×0 (degenerate = hidden view) until a split
       engages. The gutter between them is a REAL splitter (drag → the backend
       remembers the ratio per conversation); pane widths come from JS. */
    #page-slot-a, #page-slot-b { min-width: 0; }
    #split-gutter {
      display: none;
      position: relative;
      flex: none;
      width: 12px;
      cursor: col-resize;
      background: transparent;
      touch-action: none;
      outline: none;
    }
    #split-gutter::before {
      content: '';
      position: absolute;
      top: 6px;
      bottom: 6px;
      left: 50%;
      width: 1px;
      transform: translateX(-50%);
      border-radius: 2px;
      background: hsl(var(--border, 218 14% 20%));
      transition: width 0.15s, background 0.15s;
    }
    #split-gutter:hover::before, #split-gutter.drag::before {
      width: 3px;
      background: hsl(var(--ring, 218 100% 65%) / 0.7);
    }
    #split-gutter::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 36px;
      transform: translate(-50%, -50%);
      border-radius: 2px;
      background: hsl(var(--ring, 218 100% 65%) / 0.45);
      opacity: 0;
      transition: opacity 0.15s;
    }
    #split-gutter:hover::after, #split-gutter.drag::after { opacity: 1; }
    #split-gutter:focus-visible::before { width: 3px; background: hsl(var(--ring, 218 100% 65%)); }
    #split-tip {
      position: fixed;
      z-index: 60;
      transform: translate(-50%, 0);
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 10px;
      line-height: 16px;
      background: hsl(var(--foreground, 220 21% 92%));
      color: hsl(var(--background, 222 19% 7%));
      box-shadow: 0 2px 8px hsl(0 0% 0% / 0.3);
      display: none;
      pointer-events: none;
      white-space: nowrap;
    }
    body.split #split-gutter { display: block; }

    /* Split mode: the shared strip shows ONE chip per pane, in two segments
       sized by the split ratio — each chip sits directly above its own
       engine view, VS Code editor-group style. */
    #tabs .tab-seg {
      display: flex;
      align-items: stretch;
      gap: 2px;
      min-width: 0;
      overflow: hidden;
    }

    /* ── Tab strip ──
       IN DOCUMENT FLOW above the toolbar: the engine view covers all DOM, so
       the strip must squeeze the page slot rather than float. Height changes
       re-fire the slot's ResizeObserver, which repositions the engine — the
       same mechanism the omnibox uses. */
    #tabs {
      display: none;              /* shown by JS when there is more than nothing */
      flex: none;
      align-items: stretch;
      gap: 2px;
      height: 26px;
      padding: 2px 4px 0;
      overflow-x: auto;
      overflow-y: hidden;
      user-select: none;
    }
    #tabs .tab {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 48px;
      max-width: 160px;
      padding: 0 6px;
      border-radius: 6px 6px 0 0;
      font-size: 11px;
      line-height: 22px;
      color: hsl(var(--muted-foreground, 217 9% 59%));
      cursor: default;
      white-space: nowrap;
    }
    #tabs .tab span {
      overflow: hidden; text-overflow: ellipsis;
    }
    #tabs .tab:hover { background: hsl(var(--accent, 221 19% 17%) / 0.5); }
    #tabs .tab.on {
      background: hsl(var(--accent, 221 19% 17%));
      color: hsl(var(--foreground, 220 21% 92%));
    }
    #tabs .tab .x {
      flex: none;
      width: 14px; height: 14px;
      padding: 0;
      border: none; border-radius: 3px;
      background: transparent;
      color: inherit;
      font-size: 11px; line-height: 14px;
      cursor: pointer;
      opacity: 0;
    }
    #tabs .tab:hover .x, #tabs .tab.on .x { opacity: 0.7; }
    #tabs .tab .x:hover { opacity: 1; }
    #tabs .newtab {
      flex: none;
      width: 22px;
      border: none; border-radius: 4px;
      background: transparent;
      color: hsl(var(--muted-foreground, 217 9% 59%));
      font-size: 13px; line-height: 22px;
      cursor: pointer;
    }
    #tabs .newtab:hover { background: hsl(var(--accent, 221 19% 17%)); }
  </style>
</head>
<body>
  <div id="tabs"></div>
  <div id="toolbar">
    <button id="btn-back" title="后退" aria-label="后退"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
    <button id="btn-forward" title="前进" aria-label="前进"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
    <button id="btn-reload" title="刷新" aria-label="刷新"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button>
    <button id="btn-star" title="收藏此页" aria-label="收藏此页" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>
    <input id="url" type="text" spellcheck="false" placeholder="输入网址,回车打开" autocomplete="off" />
  </div>

  <div id="omnibox" hidden>
    <div id="omni-list"></div>
    <div id="omni-foot">
      <label id="private-wrap" title="开启后,访问过的页面不进入历史记录;登录状态和 cookie 不受影响">
        <input type="checkbox" id="chk-private" /> 不记历史
      </label>
      <label id="sel-wrap" title="开启后,在网页里选中文字会在选区下方弹出操作条">
        <input type="checkbox" id="chk-sel" /> 划词
      </label>
      <button id="btn-clear" title="删除全部历史记录">清空历史</button>
    </div>
  </div>

  <div id="page-slot">
    <div id="page-slot-a"></div>
    <div id="split-gutter" title="拖动调整分屏比例"></div>
    <div id="page-slot-b"></div>
  </div>

  <script>
    (function () {
      var input = document.getElementById('url');
      var omnibox = document.getElementById('omnibox');
      var list = document.getElementById('omni-list');
      var btnStar = document.getElementById('btn-star');
      var chkPrivate = document.getElementById('chk-private');
      var chkSel = document.getElementById('chk-sel');
      var btnClear = document.getElementById('btn-clear');

      // Bind the host engine views. `#page-slot-a` carries the focused tab;
      // `#page-slot-b` carries the split's right pane (its tag is empty while
      // no split is engaged, and the pane itself is display:none so the slot
      // reports 0×0 — the host hides the view). A tab switch changes no DOM
      // size, so refresh() is what re-reports.
      var slotHandle = window.piSDK.liveSlot('page', document.getElementById('page-slot-a'), function () {
        return state.activeTabId;
      });
      var slotBHandle = window.piSDK.liveSlot('page-b', document.getElementById('page-slot-b'), function () {
        var s = state.split;
        return s ? s[1] : '';
      });

      function act(method, params) {
        return window.piSDK.request(method, params).catch(function (e) {
          console.warn(method, e && e.message ? e.message : e);
        });
      }

      // ── Tab strip ──
      var tabsEl = document.getElementById('tabs');
      function applySplitClass() {
        var on = !!(state.split && state.split[1]);
        document.body.classList.toggle('split', on);
        // Pane widths follow the remembered ratio (primary's share).
        var paneA = document.getElementById('page-slot-a');
        if (on) {
          var r = Math.min(0.8, Math.max(0.2, state.splitRatio || 0.5));
          paneA.style.flex = '0 0 ' + (r * 100).toFixed(2) + '%';
        } else {
          paneA.style.flex = '';
        }
      }
      // The split sash: the single divider between the two panes. Invisible
      // wide hit area; hover thickens the line and shows a grip; drag shows a
      // live share pill; double-click resets to 50/50; arrows nudge by 2%.
      // The ratio persists per conversation (backend split.ratio).
      (function () {
        var gutter = document.getElementById('split-gutter');
        var region = document.getElementById('page-slot');
        var tip = document.createElement('div');
        tip.id = 'split-tip';
        document.body.appendChild(tip);
        var SNAP = 0.025;
        var clamp = function (r) { return Math.min(0.8, Math.max(0.2, r)); };
        var setRatio = function (r) {
          state.splitRatio = r;
          applySplitClass();
        };
        gutter.tabIndex = 0;
        gutter.setAttribute('role', 'separator');
        gutter.setAttribute('aria-orientation', 'vertical');
        gutter.setAttribute('aria-label', '拖动调整分屏比例（双击复位为对半，方向键微调）');
        gutter.addEventListener('pointerdown', function (e) {
          e.preventDefault();
          gutter.classList.add('drag');
          if (gutter.setPointerCapture) { try { gutter.setPointerCapture(e.pointerId); } catch (err) {} }
          var move = function (ev) {
            var rect = region.getBoundingClientRect();
            if (rect.width <= 0) return;
            var ratio = (ev.clientX - rect.left) / rect.width;
            if (Math.abs(ratio - 0.5) < SNAP) ratio = 0.5;
            setRatio(clamp(ratio));
            tip.style.display = 'block';
            tip.style.left = ev.clientX + 'px';
            tip.style.top = rect.top + 10 + 'px';
            tip.textContent = Math.round(state.splitRatio * 100) + ' · ' + Math.round((1 - state.splitRatio) * 100);
          };
          var up = function () {
            gutter.classList.remove('drag');
            tip.style.display = 'none';
            gutter.removeEventListener('pointermove', move);
            gutter.removeEventListener('pointerup', up);
            window.removeEventListener('pointermove', move);
            window.removeEventListener('pointerup', up);
            act('split.ratio', { ratio: state.splitRatio });
          };
          if (gutter.setPointerCapture) {
            gutter.addEventListener('pointermove', move);
            gutter.addEventListener('pointerup', up);
          } else {
            window.addEventListener('pointermove', move);
            window.addEventListener('pointerup', up);
          }
        });
        gutter.addEventListener('dblclick', function () {
          setRatio(0.5);
          act('split.ratio', { ratio: 0.5 });
        });
        gutter.addEventListener('keydown', function (e) {
          var next = null;
          if (e.key === 'ArrowLeft') next = clamp(state.splitRatio - 0.02);
          else if (e.key === 'ArrowRight') next = clamp(state.splitRatio + 0.02);
          else if (e.key === 'Home') next = 0.2;
          else if (e.key === 'End') next = 0.8;
          if (next != null) {
            e.preventDefault();
            setRatio(next);
            act('split.ratio', { ratio: next });
          }
        });
      })();
      // Native popup menu (OS-level — floats above the engine views, unlike
      // any DOM dropdown in this page). No unsplit item: closing a split tab
      // (its ×) collapses the split, so the menu only ever offers the split.
      function openTabMenu(tab) {
        window.piSDK.showPopupMenu([{ id: 'split-right', label: '向右拆分' }], lastMouse.x, lastMouse.y).then(function (picked) {
          if (picked === 'split-right') {
            var right = (state.tabs.find(function (t) { return t.id !== tab.id && !t.evicted; }) || {}).id;
            if (right) act('split.set', { tabs: [tab.id, right], ratio: state.splitRatio });
          }
        });
      }
      var lastMouse = { x: 0, y: 0 };
      function makeChip(t, split) {
        var isSplitRight = !!(split && split[1] === t.id);
        var el = document.createElement('div');
        el.className = 'tab on';
        el.draggable = true;
        el.dataset.tabId = t.id;
        var label = document.createElement('span');
        label.textContent = t.title || shortUrl(t.url) || '新标签页';
        el.title = t.url || '';
        el.appendChild(label);
        var x = document.createElement('button');
        x.className = 'x';
        x.textContent = '×';
        x.setAttribute('aria-label', '关闭标签页');
        x.onclick = function (e) { e.stopPropagation(); act('tabs.close', { tabId: t.id }); };
        el.appendChild(x);
        el.onclick = function () {
          // Both split panes are visible — clicking a chip swaps which side
          // it renders on instead of doubling it into the left pane.
          if (split && split[1] === t.id && split[0] !== t.id) {
            act('split.set', { tabs: [t.id, split[0]], ratio: state.splitRatio });
            return;
          }
          act('tabs.activate', { tabId: t.id });
        };
        el.oncontextmenu = function (e) {
          e.preventDefault();
          e.stopPropagation();
          lastMouse.x = e.clientX; lastMouse.y = e.clientY;
          openTabMenu(t);
        };
        el.ondblclick = function (e) {
          e.preventDefault();
          lastMouse.x = e.clientX; lastMouse.y = e.clientY;
          openTabMenu(t);
        };
        el.addEventListener('dragstart', function (e) {
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', t.id);
        });
        el.addEventListener('dragover', function (e) { e.preventDefault(); });
        el.addEventListener('drop', function (e) {
          e.preventDefault();
          var from = e.dataTransfer.getData('text/plain');
          if (from && from !== t.id) act('tabs.reorder', { tabId: from, beforeTabId: t.id });
        });
        return el;
      }
      function renderTabs() {
        var tabs = state.tabs || [];
        var active = state.activeTabId || '';
        var split = state.split || null;
        applySplitClass();
        var changed = tabsEl.dataset.active !== active || tabsEl.dataset.split !== String(split ? split[1] : '');
        tabsEl.dataset.active = active;
        tabsEl.dataset.split = String(split ? split[1] : '');
        tabsEl.textContent = '';
        if (tabs.length === 0) {
          tabsEl.style.display = 'none';
        } else {
          tabsEl.style.display = 'flex';
          if (split) {
            // VS Code-style split: each pane's tab chip sits above ITS OWN
            // content, and the two segments size with the split ratio so the
            // chips line up over their engine views.
            var slotW = document.getElementById('page-slot').getBoundingClientRect().width;
            var r = Math.min(0.8, Math.max(0.2, state.splitRatio || 0.5));
            var segA = document.createElement('div');
            segA.className = 'tab-seg';
            segA.style.flex = '0 0 ' + (r * 100).toFixed(2) + '%';
            var leftTab = tabs.find(function (t) { return t.id === split[0]; });
            if (leftTab) segA.appendChild(makeChip(leftTab, split));
            var segB = document.createElement('div');
            segB.className = 'tab-seg';
            segB.style.flex = '1 1 0%';
            var rightTab = tabs.find(function (t) { return t.id === split[1]; });
            if (rightTab) segB.appendChild(makeChip(rightTab, split));
            tabsEl.appendChild(segA);
            tabsEl.appendChild(segB);
          } else {
            for (var i = 0; i < tabs.length; i++) {
              (function (t) {
                var el = document.createElement('div');
                el.className = 'tab' + (t.id === active ? ' on' : '');
                el.draggable = true;
                el.dataset.tabId = t.id;
                var label = document.createElement('span');
                label.textContent = t.title || shortUrl(t.url) || '新标签页';
                el.title = t.url || '';
                if (t.evicted) label.textContent += ' (重新打开会重载)';
                el.appendChild(label);
                var x = document.createElement('button');
                x.className = 'x';
                x.textContent = '×';
                x.setAttribute('aria-label', '关闭标签页');
                x.onclick = function (e) { e.stopPropagation(); act('tabs.close', { tabId: t.id }); };
                el.appendChild(x);
                el.onclick = function () { act('tabs.activate', { tabId: t.id }); };
                el.oncontextmenu = function (e) {
                  e.preventDefault();
                  e.stopPropagation();
                  lastMouse.x = e.clientX; lastMouse.y = e.clientY;
                  openTabMenu(t);
                };
                el.ondblclick = function (e) {
                  e.preventDefault();
                  lastMouse.x = e.clientX; lastMouse.y = e.clientY;
                  openTabMenu(t);
                };
                el.addEventListener('dragstart', function (e) {
                  e.dataTransfer.effectAllowed = 'move';
                  e.dataTransfer.setData('text/plain', t.id);
                });
                el.addEventListener('dragover', function (e) { e.preventDefault(); });
                el.addEventListener('drop', function (e) {
                  e.preventDefault();
                  var from = e.dataTransfer.getData('text/plain');
                  if (from && from !== t.id) act('tabs.reorder', { tabId: from, beforeTabId: t.id });
                });
                tabsEl.appendChild(el);
              })(tabs[i]);
            }
          }
          var plus = document.createElement('button');
          plus.className = 'newtab';
          plus.textContent = '+';
          plus.title = '新建标签页';
          plus.setAttribute('aria-label', '新建标签页');
          plus.onclick = function () { act('tabs.new', {}); };
          tabsEl.appendChild(plus);
        }
        // Focus or split changed → the engine views must follow.
        if (changed && slotHandle && slotHandle.refresh) slotHandle.refresh();
        if (slotBHandle && slotBHandle.refresh) slotBHandle.refresh();
      }
      function shortUrl(u) {
        try {
          var s = String(u || '').replace(/^https?:\/\//i, '');
          return s.split('/')[0] + (s.split('/')[1] ? '/' + s.split('/')[1] : '');
        } catch (e) { return String(u || ''); }
      }

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      // ── Panel state ──
      var state = {
        url: '',
        title: '',
        favorited: false,
        private: false,
        selPopup: true,
        favorites: [],   // last omnibox.search answer
        history: [],
        recipes: [],     // recorded operations for the CURRENT site
        recipeSite: '',  // registrable domain those recipes belong to
        recipeOrigin: '',
        editing: null,   // recipe being edited in the dropdown
        running: null,   // recipe being test-run (executes for real)
        active: -1,      // highlighted row across both sections
        tabs: [],        // this conversation's tabs (mirror of the backend)
        activeTabId: '',
        split: null,     // [leftTabId, rightTabId] while the panes are split
        splitRatio: 0.5  // the panes' width share (primary's fraction)
      };
      var searchSeq = 0;

      function displayUrl(u) {
        return String(u || '').replace(/^https?:\/\//i, '');
      }

      function flatItems() {
        return state.favorites.concat(state.history);
      }

      function isRecordable(u) {
        return /^https?:\/\//i.test(String(u || ''));
      }

      /**
       * What to search for. The address bar holds the current page's URL, so
       * taking it at face value would filter the list down to nothing the
       * moment you click the bar — the launcher (favorites + recent) is what
       * an untouched bar should show. Only text the user actually typed
       * counts as a query.
       */
      function queryOf() {
        var value = input.value.trim();
        if (!value || value === state.url) return '';
        return value;
      }

      function updateStar() {
        var usable = isRecordable(state.url);
        btnStar.disabled = !usable;
        // Filled/outline is driven by the `.on` class on the SVG; writing
        // textContent here would erase the icon.
        btnStar.classList.toggle('on', state.favorited);
        btnStar.setAttribute('aria-pressed', state.favorited ? 'true' : 'false');
        btnStar.title = state.favorited
          ? '取消收藏（本站已记录的快捷方式会保留，可在地址栏删除）'
          : '收藏此页（收藏后本站重复的操作会记成快捷方式）';
      }

      // ── Omnibox ──
      function openOmnibox() {
        if (omnibox.hidden) {
          omnibox.hidden = false;
          refreshList();
        }
      }

      function closeOmnibox() {
        omnibox.hidden = true;
        state.active = -1;
        // A test run is a VIEW inside the dropdown, not a mode: closing the
        // dropdown ends it. Leaving it behind replaced the list with the old
        // run report the next time the address bar was clicked — favorites and
        // history looked "gone". The recipe's health is already saved.
        state.running = null;
        disarmClear();
      }

      function refreshList() {
        var seq = ++searchSeq;
        var pending = window.piSDK.request('omnibox.search', { query: queryOf() })
          .then(function (res) {
            if (seq !== searchSeq) return;  // a newer keystroke already answered
            state.favorites = (res && res.favorites) || [];
            state.history = (res && res.history) || [];
            // Keep the highlight where it was (clamped) rather than clearing
            // it: the answer is one IPC round-trip behind the keystroke that
            // asked for it, and ArrowDown on a closed omnibox asks for a
            // highlight before the rows it points at exist.
            state.active = Math.max(-1, Math.min(state.active, flatItems().length - 1));
            renderList();
            setActive(state.active);
          })
          .catch(function () {});
        // Recipes belong to the site on screen, so they are fetched alongside
        // and filtered here — the omnibox query itself is about addresses.
        window.piSDK.request('recipes.list', { url: state.url })
          .then(function (rr) {
            if (seq !== searchSeq) return;
            state.recipes = (rr && rr.recipes) || [];
            state.recipeSite = (rr && rr.site) || '';
            state.recipeOrigin = (rr && rr.origin) || '';
            renderList();
          })
          .catch(function () {});
        return pending;
      }

      /** alt(a || b || c) → "a …" — the fallbacks are noise in a preview. */
      function prettyTarget(t) {
        var m = /^alt\(([\s\S]*)\)$/.exec(String(t || ''));
        if (!m) return String(t || '');
        var parts = m[1].split('||').map(function (s) { return s.trim(); }).filter(Boolean);
        if (parts.length <= 1) return parts[0] || String(t || '');
        return parts[0] + ' …';
      }

      /**
       * The test-run view. It shows the steps BEFORE running them, because
       * this really executes: a recipe that posts or orders would do exactly
       * that. Parameters and file paths are the only things the user supplies.
       */
      function runHtml() {
        var rn = state.running;
        var rec = rn.snapshot || null;
        var i;
        for (i = 0; i < state.recipes.length; i++) {
          if (state.recipes[i].id === rn.id) { rec = state.recipes[i]; break; }
        }
        if (!rec) {
          // Deleted in another panel while this view was open: say so, and
          // leave a way back to the list.
          return (
            '<div class="sec">运行配方</div>' +
            '<div class="empty">这条配方已经不在了</div>' +
            '<div class="re-actions"><button class="run-cancel">关闭</button></div>'
          );
        }

        var bad = rec.lastError ? rec.lastError.step : 0;
        var steps = '';
        var tokens = [];
        for (i = 0; i < rec.steps.length; i++) {
          var st = rec.steps[i];
          var found = String(st.value || '').match(/\{\{\d+\}\}/g) || [];
          for (var k = 0; k < found.length; k++) {
            if (tokens.indexOf(found[k]) === -1) tokens.push(found[k]);
          }
          steps +=
            '<div class="run-step' + (bad === i + 1 ? ' bad' : '') + '">' +
              '<span class="re-kind">' + esc(st.kind) + '</span>' +
              '<span class="run-t">' + esc(prettyTarget(st.target)) + '</span>' +
              (st.kind === 'upload'
                ? '<input class="run-file" data-step="' + i + '" placeholder="本地文件绝对路径" value="' +
                    esc(rn.values['file:' + i] || '') + '">'
                : '') +
            '</div>';
        }

        var params = '';
        for (i = 0; i < tokens.length; i++) {
          params +=
            '<label class="re-name-label">参数 ' + esc(tokens[i].replace(/[{}]/g, '')) +
              '<input class="run-val" data-token="' + esc(tokens[i]) + '" value="' +
                esc(rn.values[tokens[i]] || '') + '">' +
            '</label>';
        }

        var out = '';
        if (rn.busy) {
          out = '<div class="run-head">正在运行…</div>';
        } else if (rn.done) {
          if (rn.failedStep) {
            out += '<div class="run-head bad">第 ' + rn.failedStep + ' 步失败：' + esc(rn.error || '') + '</div>';
          } else if (rn.error) {
            out += '<div class="run-head bad">' + esc(rn.error) + '</div>';
          } else {
            out += '<div class="run-head">✓ 跑完了 ' + rn.log.length + ' 步</div>';
          }
          for (i = 0; i < rn.log.length; i++) out += '<div class="line">' + esc(rn.log[i]) + '</div>';
          for (i = 0; i < rn.gaps.length; i++) out += '<div class="line">⚠ ' + esc(rn.gaps[i]) + '</div>';
          out = '<div class="run-out">' + out + '</div>';
        }

        return (
          '<div class="sec">运行配方</div>' +
          '<div class="recipe-run" data-id="' + esc(rec.id) + '">' +
            '<div class="run-title">' + esc(rec.name) + ' · ' + rec.steps.length + ' 步</div>' +
            '<div class="run-tip">会真的执行每一步——发消息、提交表单、下单这类操作会真的发生。</div>' +
            '<div class="run-steps">' + steps + '</div>' +
            params +
            '<div class="re-actions">' +
              '<button class="re-save run-go"' + (rn.busy ? ' disabled' : '') + '>' +
                (rn.done ? '再运行' : '运行') +
              '</button>' +
              '<button class="run-cancel">' + (rn.done ? '关闭' : '取消') + '</button>' +
            '</div>' +
            out +
          '</div>'
        );
      }

      function renderList() {
        var rows = [];
        var i;

        // Editing replaces the list: selectors are text, and a text field is
        // the honest editor for them.
        if (state.editing) {
          var ed = state.editing;
          rows.push('<div class="sec">编辑配方</div>');
          // Say WHY it broke, not just that it did: a red banner naming the
          // step is the difference between fixing it and guessing.
          if (ed.lastError) {
            rows.push(
              '<div class="re-warn">上次运行在第 ' + ed.lastError.step + ' 步失败：' +
                esc(ed.lastError.message || '（没有记录原因）') +
              '</div>'
            );
          }
          var stepHtml = '';
          for (i = 0; i < ed.steps.length; i++) {
            var st = ed.steps[i];
            var hasValue = st.kind === 'fill' || st.kind === 'select';
            var bad = ed.lastError && ed.lastError.step === i + 1;
            stepHtml +=
              '<div class="re-step' + (bad ? ' bad' : '') + '" data-kind="' + esc(st.kind) + '">' +
                '<span class="re-kind">' + esc(st.kind) + '</span>' +
                '<input class="re-target" value="' + esc(st.target) + '" placeholder="目标: #id / [name=…] / role=… / text=…">' +
                (hasValue ? '<input class="re-value" value="' + esc(st.value || '') + '" placeholder="值，如 {{1}}">' : '') +
                '<input class="re-expect" value="' + esc(st.expect || '') + '" placeholder="预期（可空）">' +
              '</div>';
          }
          rows.push(
            '<div class="recipe-edit" data-id="' + esc(ed.id) + '">' +
              '<label class="re-name-label">名称<input class="re-name" value="' + esc(ed.name) + '"></label>' +
              '<div class="re-steps">' + stepHtml + '</div>' +
              '<div class="re-actions"><button class="re-save">保存</button><button class="re-cancel">取消</button></div>' +
            '</div>'
          );
          list.innerHTML = rows.join('');
          return;
        }

        // A test run is the same steps the agent would run, executed by the
        // user's hand: it shows the steps before running (they really happen)
        // and reports each one afterwards.
        if (state.running) {
          rows.push(runHtml());
          list.innerHTML = rows.join('');
          return;
        }

        if (state.favorites.length) {
          rows.push('<div class="sec">★ 收藏</div>');
          for (i = 0; i < state.favorites.length; i++) {
            rows.push(rowHtml(state.favorites[i], i, true));
          }
        }
        if (state.history.length) {
          rows.push('<div class="sec">最近访问</div>');
          for (i = 0; i < state.history.length; i++) {
            rows.push(rowHtml(state.history[i], state.favorites.length + i, false));
          }
        }
        if (state.recipes.length) {
          rows.push('<div class="sec">⚡ ' + esc(state.recipeSite || '本站') + ' 配方</div>');
          for (i = 0; i < state.recipes.length; i++) {
            var rec = state.recipes[i];
            var stale = rec.failures >= 2 ? ' · 已失效' : '';
            // Where it broke last time — a stale row that says "第 2 步失败"
            // is actionable; "已失效" alone sends the user into the editor blind.
            var broke = rec.lastError ? ' · 上次第 ' + rec.lastError.step + ' 步失败' : '';
            var host = rec.origin !== state.recipeOrigin ? esc(rec.origin.replace(/^https?:\/\//, '')) + ' · ' : '';
            rows.push(
              '<div class="recipe-row">' +
                '<div class="row-main">' +
                  '<div class="row-title">' + esc(rec.name) + '</div>' +
                  '<div class="row-url">' + host + rec.steps.length + ' 步 · 用过 ' + rec.uses + ' 次' + broke + stale + '</div>' +
                '</div>' +
                '<button class="row-x" data-run="' + esc(rec.id) + '" title="运行这条配方（真的执行每一步）">▶</button>' +
                '<button class="row-x" data-edit="' + esc(rec.id) + '" title="编辑这条配方">✎</button>' +
                '<button class="row-x" data-recipe="' + esc(rec.id) + '" title="删除这条配方">✕</button>' +
              '</div>'
            );
          }
        }
        // Consent is shown where the recipes appear: this is what favoriting
        // turned on, and where it can be undone.
        if (state.favorited) {
          rows.push('<div class="recipe-note">已收藏本站：成功完成的操作会自动记成快捷方式，条目可在上方删除。</div>');
        }
        if (!rows.length) {
          rows.push('<div class="empty">' +
            (queryOf()
              ? '没有匹配的收藏或历史记录'
              : '收藏和历史记录会出现在这里') +
            '</div>');
        }
        list.innerHTML = rows.join('');
      }

      function rowHtml(item, index, isFav) {
        var title = item.title || displayUrl(item.url);
        var side = isFav ? '' : '<span class="row-side">' + esc(whenLabel(item.lastVisitedAt)) + '</span>';
        var x = isFav ? '<button class="row-x" data-remove="' + index + '" title="取消收藏">✕</button>' : '';
        return (
          '<div class="row" data-open="' + index + '">' +
            '<div class="row-main">' +
              '<div class="row-title">' + esc(title) + '</div>' +
              '<div class="row-url">' + esc(displayUrl(item.url)) + '</div>' +
            '</div>' +
            side + x +
          '</div>'
        );
      }

      function whenLabel(ts) {
        var d = new Date(ts || 0);
        if (isNaN(d.getTime())) return '';
        var now = new Date();
        var sameDay = function (a, b) {
          return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
        };
        var hm = function (x) {
          return ('0' + x.getHours()).slice(-2) + ':' + ('0' + x.getMinutes()).slice(-2);
        };
        if (sameDay(d, now)) return '今天 ' + hm(d);
        var y = new Date(now); y.setDate(y.getDate() - 1);
        if (sameDay(d, y)) return '昨天 ' + hm(d);
        return (d.getMonth() + 1) + '月' + d.getDate() + '日';
      }

      function setActive(i) {
        var items = flatItems();
        state.active = Math.max(-1, Math.min(i, items.length - 1));
        var rows = list.querySelectorAll('.row');
        for (var k = 0; k < rows.length; k++) {
          rows[k].classList.toggle('active', Number(rows[k].getAttribute('data-open')) === state.active);
        }
        // .sec headers are not .row, so this NodeList lines up with flatItems()
        // one for one — index it directly, no offset for the headers.
        var el = rows.length ? rows[state.active] : null;
        if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
      }

      function choose(item) {
        if (!item || !item.url) return;
        act('nav.open', { url: item.url });
        closeOmnibox();
        input.blur();
      }

      // mousedown inside the dropdown must not move focus, or the input's blur
      // would close the list before the click lands (the classic combobox trap).
      omnibox.addEventListener('mousedown', function (e) {
        // The recipe editor and the test runner hold real inputs — they must
        // be able to take focus.
        if (e.target && e.target.closest && e.target.closest('.recipe-edit, .recipe-run')) return;
        e.preventDefault();
      });

      /**
       * Execute the recipe right here, on the conversation's own tab. The
       * backend refuses when the page is on another site — a recipe is bound
       * to the origin it was recorded on, and #name means other things there.
       */
      function startRun() {
        var rn = state.running;
        if (!rn || rn.busy) return;
        var wrap = list.querySelector('.recipe-run');
        if (wrap) {
          var vals = wrap.querySelectorAll('.run-val');
          var i;
          for (i = 0; i < vals.length; i++) rn.values[vals[i].getAttribute('data-token')] = vals[i].value;
          var files = wrap.querySelectorAll('.run-file');
          for (i = 0; i < files.length; i++) {
            rn.values['file:' + files[i].getAttribute('data-step')] = files[i].value;
          }
        }
        rn.busy = true;
        rn.done = false;
        rn.log = [];
        rn.gaps = [];
        rn.failedStep = 0;
        rn.error = '';
        renderList();
        window.piSDK.request('recipes.run', { id: rn.id, values: rn.values })
          .then(function (res) {
            rn.busy = false;
            rn.done = true;
            rn.log = (res && res.log) || [];
            rn.gaps = (res && res.gaps) || [];
            rn.failedStep = (res && res.failedStep) || 0;
            rn.error = (res && res.error) || '';
            if (res && res.missing) {
              rn.error = '还缺参数：' + res.missing.map(function (m) {
                return String(m).replace(/[{}]/g, '');
              }).join('、');
            }
            // Re-read the list: the run just changed this recipe's health.
            refreshList();
          })
          .catch(function (err) {
            rn.busy = false;
            rn.done = true;
            rn.error = (err && err.message) || String(err);
            renderList();
          });
      }

      // Typing must survive a re-render (the address bar asks for the list on
      // every keystroke and each answer repaints it).
      list.addEventListener('input', function (e) {
        var rn = state.running;
        var el = e.target;
        if (!rn || !el || !el.classList) return;
        if (el.classList.contains('run-val')) rn.values[el.getAttribute('data-token')] = el.value;
        else if (el.classList.contains('run-file')) rn.values['file:' + el.getAttribute('data-step')] = el.value;
      });

      list.addEventListener('click', function (e) {
        var target = e.target;
        var eBtn = target.closest ? target.closest('[data-edit]') : null;
        if (eBtn) {
          var edId = eBtn.getAttribute('data-edit');
          state.running = null;
          state.editing = state.recipes.filter(function (r) { return r.id === edId; })[0] || null;
          renderList();
          return;
        }
        // ── Test run ──
        var runBtn = target.closest ? target.closest('[data-run]') : null;
        if (runBtn) {
          var runId = runBtn.getAttribute('data-run');
          var pick = state.recipes.filter(function (r) { return r.id === runId; })[0] || null;
          state.editing = null;
          state.running = {
            id: runId,
            snapshot: pick,
            values: {},
            log: [],
            gaps: [],
            failedStep: 0,
            error: '',
            busy: false,
            done: false,
          };
          renderList();
          return;
        }
        var goBtn = target.closest ? target.closest('.run-go') : null;
        if (goBtn) { startRun(); return; }
        var stopBtn = target.closest ? target.closest('.run-cancel') : null;
        if (stopBtn) { state.running = null; refreshList(); return; }
        var saveBtn = target.closest ? target.closest('.re-save') : null;
        if (saveBtn) {
          var wrap = list.querySelector('.recipe-edit');
          var editedSteps = [];
          if (wrap) {
            var rows = wrap.querySelectorAll('.re-step');
            for (var k = 0; k < rows.length; k++) {
              var row = rows[k];
              var tgt = row.querySelector('.re-target').value.trim();
              if (!tgt) continue;
              var vEl = row.querySelector('.re-value');
              var eEl = row.querySelector('.re-expect');
              editedSteps.push({
                kind: row.getAttribute('data-kind'),
                target: tgt,
                value: vEl ? vEl.value : undefined,
                expect: eEl && eEl.value ? eEl.value : undefined,
              });
            }
            window.piSDK.request('recipes.update', {
              id: wrap.getAttribute('data-id'),
              name: wrap.querySelector('.re-name').value,
              steps: editedSteps,
            }).then(function (res) {
              if (res && res.ok) { state.editing = null; refreshList(); }
            }).catch(function () {});
          }
          return;
        }
        var cancelBtn = target.closest ? target.closest('.re-cancel') : null;
        if (cancelBtn) { state.editing = null; refreshList(); return; }
        var rBtn = target.closest ? target.closest('[data-recipe]') : null;
        if (rBtn) {
          act('recipes.delete', { id: rBtn.getAttribute('data-recipe') }).then(refreshList);
          return;
        }
        var xBtn = target.closest ? target.closest('[data-remove]') : null;
        if (xBtn) {
          var idx = Number(xBtn.getAttribute('data-remove'));
          var item = flatItems()[idx];
          if (item) {
            act('favorites.remove', { url: item.url }).then(refreshList);
          }
          return;
        }
        var row = target.closest ? target.closest('[data-open]') : null;
        if (row) choose(flatItems()[Number(row.getAttribute('data-open'))]);
      });

      // ── Toolbar ──
      btnStar.addEventListener('click', function () {
        if (!isRecordable(state.url)) return;
        window.piSDK.request('favorites.toggle', { url: state.url, title: state.title })
          .then(function (res) {
            if (res && typeof res.favorited === 'boolean') {
              state.favorited = res.favorited;
              updateStar();
            }
          })
          .catch(function (e) { console.warn('favorites.toggle', e && e.message ? e.message : e); });
      });

      document.getElementById('btn-back').addEventListener('click', function () { act('nav.back'); });
      document.getElementById('btn-forward').addEventListener('click', function () { act('nav.forward'); });
      document.getElementById('btn-reload').addEventListener('click', function () { act('nav.reload'); });

      // ── Address bar ──
      input.addEventListener('focus', function () {
        openOmnibox();
        // Like a real address bar: the first click selects the URL so typing
        // replaces it; clicking again (already focused, so no second focus
        // event) drops the caret where you clicked, for editing it instead.
        input.select();
      });
      input.addEventListener('input', function () {
        openOmnibox();
        refreshList();
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          closeOmnibox();
          input.blur();
          return;
        }
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          openOmnibox();
          setActive(state.active + 1);
          return;
        }
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          setActive(state.active - 1);
          return;
        }
        if (e.key === 'Enter') {
          var items = flatItems();
          if (state.active >= 0 && state.active < items.length) {
            choose(items[state.active]);
            return;
          }
          var value = input.value.trim();
          if (value) act('nav.open', { url: value });
          closeOmnibox();
          input.blur();
        }
      });
      // Clicking into the page (the native engine view) steals focus without
      // our page hearing a click — window blur is the only signal we get.
      window.addEventListener('blur', closeOmnibox);

      // ── Footer: private mode + selection popup + clear history ──
      chkPrivate.addEventListener('change', function () {
        window.piSDK.request('settings.setPrivate', { private: chkPrivate.checked })
          .then(function (res) {
            state.private = !!(res && res.private);
            chkPrivate.checked = state.private;
          })
          .catch(function () { chkPrivate.checked = state.private; });
      });

      chkSel.addEventListener('change', function () {
        window.piSDK.request('settings.setSelPopup', { on: chkSel.checked })
          .then(function (res) {
            state.selPopup = !!(res && res.selPopup);
            chkSel.checked = state.selPopup;
          })
          .catch(function () { chkSel.checked = state.selPopup; });
      });

      var clearArmed = false;
      var clearTimer = null;
      function disarmClear() {
        clearArmed = false;
        if (clearTimer) { clearTimeout(clearTimer); clearTimer = null; }
        btnClear.textContent = '清空历史';
        btnClear.classList.remove('armed');
      }
      btnClear.addEventListener('click', function () {
        if (!clearArmed) {
          // Two-step confirm: no dialogs in a native-view panel, so arm the
          // button instead — one stray click must not erase the history.
          clearArmed = true;
          btnClear.textContent = '确认清空?';
          btnClear.classList.add('armed');
          clearTimer = setTimeout(disarmClear, 3000);
          return;
        }
        disarmClear();
        act('history.clear').then(refreshList);
      });

      // ── Backend pushes ──
      window.piSDK.onMessage(function (msg) {
        if (!msg || !msg.event || !msg.data) return;
        if (msg.event === 'ui.urlChanged') {
          input.value = String(msg.data.url || '');
          state.url = String(msg.data.url || '');
          state.title = String(msg.data.title || '');
          state.favorited = msg.data.favorited === true;
          updateStar();
          if (!omnibox.hidden) refreshList();
        } else if (msg.event === 'ui.tabs') {
          state.tabs = msg.data.tabs || [];
          state.activeTabId = String(msg.data.activeTabId || '');
          state.split = Array.isArray(msg.data.split) ? msg.data.split : null;
          state.splitRatio = typeof msg.data.splitRatio === 'number' ? msg.data.splitRatio : 0.5;
          renderTabs();
        } else if (msg.event === 'ui.favoritesChanged' || msg.event === 'ui.historyCleared') {
          if (!omnibox.hidden) refreshList();
        } else if (msg.event === 'ui.recipesChanged') {
          // A recipe's health follows every run — the agent's runs included.
          if (!omnibox.hidden) refreshList();
        } else if (msg.event === 'ui.settingsChanged') {
          state.private = msg.data.private === true;
          chkPrivate.checked = state.private;
          state.selPopup = msg.data.selPopup !== false;
          chkSel.checked = state.selPopup;
        }
      });

      // ── Boot: the shared state pull ──
      window.piSDK.request('state.get').then(function (s) {
        if (!s) return;
        input.value = String(s.url || '');
        state.url = String(s.url || '');
        state.title = String(s.title || '');
        state.favorited = s.favorited === true;
        state.private = s.private === true;
        state.selPopup = s.selPopup !== false;
        if (s.tabs) {
          state.tabs = s.tabs;
          state.activeTabId = String(s.activeTabId || '');
          state.split = Array.isArray(s.split) ? s.split : null;
          state.splitRatio = typeof s.splitRatio === 'number' ? s.splitRatio : 0.5;
          applySplitClass();
          renderTabs();
        }
        chkPrivate.checked = state.private;
        chkSel.checked = state.selPopup;
        updateStar();
      }).catch(function () {});
    })();
  </script>
</body>
</html>
