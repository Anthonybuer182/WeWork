<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库</title>
<style>
  /* 主题令牌是宿主注入的 Tailwind 风格 HSL 分量(见 packages/ui 的 panel-relay.tsx,
     内联在 <html> 上,压过这里),所以一切颜色必须写成 hsl(var(--x, <分量兜底>)):
     注入时跟随应用主题,未注入时落到这里的暗色分量。直接 var(--x) 会在注入后失效。 */
  :root {
    --background: 222 19% 7%; --foreground: 220 21% 92%;
    --card: 222 15% 11%; --card-foreground: 220 21% 92%;
    --muted: 222 16% 14%; --muted-foreground: 217 9% 59%;
    --border: 218 14% 20%;
    --primary: 218 100% 65%; --primary-foreground: 0 0% 100%;
    --radius: 8px; --font-sans: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 13px/1.6 var(--font-sans); background: hsl(var(--background, 222 19% 7%)); color: hsl(var(--foreground, 220 21% 92%)); padding: 14px; }
  .card { background: hsl(var(--card, 222 15% 11%)); border: 1px solid hsl(var(--border, 218 14% 20%)); border-radius: var(--radius, 8px); padding: 12px 14px; }
  .card h2 { font-size: 12px; font-weight: 600; letter-spacing: .3px; color: hsl(var(--muted-foreground, 217 9% 59%)); margin-bottom: 9px; }
  input { width: 100%; font: inherit; color: hsl(var(--foreground, 220 21% 92%)); background: hsl(var(--background, 222 19% 7%)); border: 1px solid hsl(var(--border, 218 14% 20%)); border-radius: 6px; padding: 6px 10px; outline: none; margin-bottom: 7px; }
  input:focus { border-color: hsl(var(--primary, 218 100% 65%)); }
  ul { list-style: none; }
  li { padding: 7px 6px; border-radius: 6px; cursor: pointer; }
  li:hover { background: rgba(127,127,127,.08); }
  li .t { font-weight: 600; }
  li .d { color: hsl(var(--muted-foreground, 217 9% 59%)); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: hsl(var(--muted-foreground, 217 9% 59%)); text-align: center; padding: 16px 0; font-size: 12.5px; }
</style>
</head>
<body>
  <div class="card">
    <h2 id="hd">知识库</h2>
    <input id="add" placeholder="添加:标题 | 内容(回车保存)…" />
    <input id="search" placeholder="搜索…" />
    <ul id="list"></ul>
    <div class="empty" id="empty" style="display:none"></div>
  </div>

  <!-- 宿主在 </head> 前注入 window.piSDK；不用自己打包，也不用写信封。 -->
  <script>
    function render(s) {
      const all = s.total ?? 0;
      const shown = s.shown ?? [];
      document.getElementById('hd').textContent =
        `知识库(${all} 条${s.search ? `,匹配 ${shown.length} 条` : ''})`;
      const se = document.getElementById('search');
      if (document.activeElement !== se && se.value !== s.search) se.value = s.search ?? '';
      const list = document.getElementById('list');
      list.innerHTML = '';
      for (const e of shown) {
        const li = document.createElement('li');
        li.innerHTML = `<div class="t"></div><div class="d"></div>`;
        li.querySelector('.t').textContent = e.title;
        li.querySelector('.d').textContent = (e.content ?? '').slice(0, 90);
        li.title = '点击删除';
        li.addEventListener('click', () => piSDK.emit('kb.delete', { key: String(e.id) }));
        list.appendChild(li);
      }
      const empty = document.getElementById('empty');
      empty.style.display = shown.length ? 'none' : 'block';
      empty.innerHTML = s.search ? '无匹配条目' : '知识库为空<br>agent 可用 kb_save 保存知识';
    }

    document.getElementById('add').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.value.trim()) {
        piSDK.emit('kb.add', e.target.value);
        e.target.value = '';
      }
    });
    document.getElementById('search').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') piSDK.emit('kb.search', e.target.value);
    });

    // 后端推来的状态
    piSDK.onMessage((m) => {
      if (m && m.event === 'ui.render') render(m.data ?? {});
    });

    // 启动先拉一次:首屏不依赖 mounted 推送的时序,推送只负责之后的更新
    piSDK.request('state.get').then(render).catch(() => {});
  </script>
</body>
</html>
