appId: com.pi.coding-agent
productName: Pi Coding Agent
# Skip native module rebuild — pnpm workspace compat.
npmRebuild: false

directories:
  buildResources: build
  output: release

# App icon (512x512 PNG). electron-builder auto-converts to .icns (macOS) and .ico (Windows).
icon: build/icon.png

# Let electron-builder auto-detect production dependencies from package.json.
# We only need to include the electron-vite output; electron-builder will pull in the
# necessary node_modules based on the "dependencies" field.
files:
  - out/**/*

# Native .node addons inside @earendil-works/pi-coding-agent must be unpacked
# from the asar archive so they can be loaded by Node at runtime.
asarUnpack:
  - "node_modules/@earendil-works/pi-coding-agent/**/*"
  - "node_modules/@mariozechner/clipboard*/**/*"

# ── No built-in plugins, but a bundled offline market ──
#
# Every plugin is distributed through the plugin marketplace and installed to
# `~/.pi/agent/plugins/` (the registry's `user` root). A packaged app therefore
# starts with ZERO plugins INSTALLED: two host panels (settings, plugin center)
# and nothing else, and the user installs what they want.
#
# This was not always the case. A release build once shipped with no plugins
# either, which looked like a bug and was "fixed" by bundling the repo's
# `plugins/` directory into the app as the builtin root. That fix created a
# worse problem: the `user` root outranks `builtin`, so any plugin the user had
# installed SHADOWED the bundled copy — a stale install silently won over a
# fresh build-in, and the bundled copies were dead weight nobody ever loaded.
# If you are here because a packaged app has no plugins: that is the intended
# state. Ship the plugin to the marketplace instead of bundling it.
#
# What IS bundled is the market itself (pack scripts run
# scripts/build-market.mjs into `market-dist/` first): index.json + one zip per
# first-party plugin, copied to `<resources>/market/`. The registry falls back
# to it when neither PI_PLUGIN_REGISTRY nor _state.json#registry names another
# source, so a fresh install can install plugins offline. The zips are
# referenced by paths relative to the index — an absolute build-machine path
# would dangle after the install moves.
#
# Windows still ships a shell bundle — that is a runtime dependency of the
# agent's bash tool, not a plugin.
extraResources:
  - from: "market-dist/"
    to: "market/"

# Office document support used to ship here as a bundled `officecli` skill
# plus a binary fetched at startup. It is now a plugin (com.pi.files) running
# the vendored GenOffice engines in its own backend — nothing to bundle and
# nothing to download.

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  # Code signing: requires Apple Developer account.
  # Uncomment and set these when you have a signing identity:
  # hardenedRuntime: true
  # gatekeeperAssess: false
  # entitlements: build/entitlements.mac.plist
  # entitlementsInherit: build/entitlements.mac.plist

win:
  # Bundle MinGit BusyBox (shell + git + coreutils) so Windows users
  # get bash-like command execution out of the box.
  # Note: platform-level extraResources OVERRIDE the top-level list rather than
  # extending it, so the bundled market must be listed here too.
  #
  # Build this target on Windows — macOS cross-builds are blocked twice:
  # rcedit needs wine and makensis ships x86_64-only, both unusable on
  # Apple Silicon without Rosetta.
  extraResources:
    - from: "bash-bundle/"
      to: "bash-bundle/"
    - from: "market-dist/"
      to: "market/"
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  # Code signing for Windows (requires certificate):
  # certificateFile: build/cert.pfx
  # certificatePassword: ${CERT_PASSWORD}

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: pi@example.com
